<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uudenmaan Padelkartta</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const centers = [

{ name:"PadelPoint Konala", lat:60.251, lng:24.846, courts:9, color:"#777777" },
{ name:"Open Padel Vallila", lat:60.194, lng:24.949, courts:9, color:"#00A878" },
{ name:"Open Padel Myllypuro", lat:60.225, lng:25.079, courts:8, color:"#00A878" },

{ name:"House of Games", lat:60.218, lng:24.723, courts:19, color:"#777777" },
{ name:"ESC Padel", lat:60.157, lng:24.694, courts:11, color:"#777777" },

{ name:"Open Padel Kaivoksela", lat:60.267, lng:24.842, courts:10, color:"#00A878" }

];

const map = L.map('map').setView([60.25,24.9],10);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap contributors'
}
).addTo(map);

centers.forEach(c => {

    L.circleMarker(
        [c.lat, c.lng],
        {
            radius: 8,
            color: c.color,
            fillColor: c.color,
            fillOpacity: 1
        }
    )
    .addTo(map)
    .bindPopup(
        '<b>' + c.name + '</b><br>Kenttiä: ' + c.courts
    );

    L.circle(
        [c.lat, c.lng],
        {
            radius: 4000,
            color: c.color,
            fillColor: c.color,
            fillOpacity: 0.2
        }
    ).addTo(map);

});

</script>

</body>
</html>
