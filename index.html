const map = L.map("map").setView(

);

        attribution: "© OpenStreetMap contributors"
    }
).addTo(map);


/*
Palauttaa keskuksen kokonaiskenttämäärän.
*/

function getTotalCourts(center) {

    if (typeof center.total === "number") {
        return center.total;
    }

    const indoor =
        typeof center.indoor === "number"
            ? center.indoor
            : 0;

    const outdoor =
        typeof center.outdoor === "number"
            ? center.outdoor
            : 0;

    return indoor + outdoor;
}


/*
Tekee popupin sisällön.
*/

function createPopup(center) {

    const total = getTotalCourts(center);

    let html =
        '<div class="popup-title">' +
        center.name +
        '</div>';

    /*
    Jos sisä/ulkojako tiedetään
    */

    if (
        typeof center.indoor === "number" ||
        typeof center.outdoor === "number"
    ) {

        const indoor =
            center.indoor || 0;

        const outdoor =
            center.outdoor || 0;

        html +=
            '<div class="popup-row">' +
            'Sisäkenttiä: <b>' +
            indoor +
            '</b></div>';

        html +=
            '<div class="popup-row">' +
            'Ulkokenttiä: <b>' +
            outdoor +
            '</b></div>';

        html +=
            '<div class="popup-row">' +
            'Yhteensä: <b>' +
            total +
            '</b></div>';
    }

    /*
    Jos tiedetään vasta kokonaismäärä
    */

    else {

        html +=
            '<div class="popup-row">' +
            'Kenttiä yhteensä: <b>' +
            total +
            '</b></div>';

        html +=
            '<div class="popup-note">' +
            'Sisä-/ulkojakoa ei ole vielä tarkistettu.' +
            '</div>';
    }

    return html;
}


/*
==========================================
KESKUSTEN PIIRTÄMINEN
==========================================
*/

centers.forEach(center => {

    const total =
        getTotalCourts(center);


    /*
    Hallin / keskuksen piste
    */

    const marker =
        L.circleMarker(
            [center.lat, center.lng],
            {
                radius: 13,
                color: "#2563eb",
                fillColor: "#2563eb",
                fillOpacity: 1,
                weight: 1
            }
        )
        .addTo(map);


    /*
    Kenttämäärä näkyviin jatkuvasti
    */

    marker.bindTooltip(
        String(total),
        {
            permanent: true,
            direction: "center",
            className: "court-label"
        }
    );


    /*
    Klikattava popup
    */

    marker.bindPopup(
        createPopup(center)
    );


    /*
    4 km vaikutusalue
    */

    L.circle(
        [center.lat, center.lng],
        {
            radius: 4000,
            color: "#2563eb",
            weight: 1,
            fillColor: "#2563eb",
            fillOpacity: 0.10,
            interactive: false
        }
    )
    .addTo(map)
    .bringToBack();
