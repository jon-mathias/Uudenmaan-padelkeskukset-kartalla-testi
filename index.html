<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
#map{
height:100vh;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map');

const bounds = centers.map(c => [c.lat, c.lng]);

map.fitBounds(bounds);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

const centers = [

{
name:"PadelPoint Konala",
lat:60.251,
lng:24.846,
courts:9,
color:"#777777"
},

{
name:"Open Padel Vallila",
lat:60.194,
lng:24.949,
courts:9,
color:"#00A878"
},

{
name:"Open Padel Myllypuro",
lat:60.225,
lng:25.079,
courts:8,
color:"#00A878"
}

];

centers.forEach(c => {

L.circleMarker(
[c.lat,c.lng],
{
radius:8,
color:c.color,
fillColor:c.color,
fillOpacity:1
}
)
.addTo(map)
.bindPopup(
`<b>${c.name}</b><br>Kenttiä: ${c.courts}`
);

L.circle(
[c.lat,c.lng],
{
radius:4000,
color:c.color,
fillColor:c.color,
fillOpacity:0.2
}
).addTo(map);

});

</script>

</body>
</html>
